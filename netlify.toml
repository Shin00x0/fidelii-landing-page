[build]
  command = "node scripts/build-netlify.mjs"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  # El sitio se publica como HTML estático desde site/index.html.
  # Evita que Netlify ejecute automáticamente el runtime de Next.js
  # (detectado por la dependencia "next"), que hacía fallar el build.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
